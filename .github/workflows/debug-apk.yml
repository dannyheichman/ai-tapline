name: Debug APK

on:
  push:
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Unit tests and debug APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: copilot-voice-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish debug APK to the v0.1.0-debug prerelease
        if: github.event_name == 'push' && (github.ref == 'refs/heads/cursor/copilot-voice-bridge-d984' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          cp "$src" copilot-voice-bridge-debug.apk
          notes="Debug sideload build of Copilot Voice Bridge.

          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}

          Open this asset on the phone and allow the install. It is a debug APK, not a Play Store release."
          if gh release view v0.1.0-debug --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.0-debug copilot-voice-bridge-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v0.1.0-debug --repo "$GITHUB_REPOSITORY" --prerelease --title "Copilot Voice Bridge v0.1.0-debug" --notes "$notes"
          else
            gh release create v0.1.0-debug \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Copilot Voice Bridge v0.1.0-debug" \
              --notes "$notes" \
              copilot-voice-bridge-debug.apk
          fi
